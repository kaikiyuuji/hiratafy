<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#101410" />
        <meta name="robots" content="noindex" />
        <title>Sem conexão - Hiratafy</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: #0d120f;
                color: #f5f7f5;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100dvh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem
                    max(1.5rem, env(safe-area-inset-bottom));
                background:
                    radial-gradient(
                        circle at 50% 15%,
                        rgba(104, 221, 55, 0.13),
                        transparent 34rem
                    ),
                    #0d120f;
            }

            main {
                width: min(100%, 27rem);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 1.5rem;
                padding: 2rem;
                text-align: center;
                background: rgba(24, 29, 26, 0.92);
                box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
            }

            img {
                width: 5.5rem;
                height: 5.5rem;
                border-radius: 1.4rem;
                box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
            }

            .status {
                display: inline-flex;
                align-items: center;
                gap: 0.45rem;
                margin-top: 1.5rem;
                border-radius: 999px;
                padding: 0.4rem 0.7rem;
                background: rgba(245, 179, 53, 0.12);
                color: #ffd991;
                font-size: 0.75rem;
                font-weight: 600;
            }

            .status::before {
                content: '';
                width: 0.45rem;
                height: 0.45rem;
                border-radius: 999px;
                background: #f5b335;
                box-shadow: 0 0 0 0.22rem rgba(245, 179, 53, 0.12);
            }

            h1 {
                margin: 1rem 0 0.5rem;
                font-size: clamp(1.5rem, 6vw, 2rem);
                letter-spacing: -0.035em;
            }

            p {
                margin: 0;
                color: #aeb8b1;
                line-height: 1.6;
            }

            button {
                width: 100%;
                margin-top: 1.5rem;
                border: 0;
                border-radius: 0.8rem;
                padding: 0.85rem 1rem;
                background: #65d737;
                color: #10200f;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }

            button:active {
                transform: scale(0.985);
            }

            small {
                display: block;
                min-height: 1.2rem;
                margin-top: 0.8rem;
                color: #7f8b83;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/pwa/icon-192.png" alt="" width="88" height="88" />
            <div class="status">Sem conexão</div>
            <h1>O Hiratafy está offline</h1>
            <p>
                Seus dados continuam protegidos. Reconecte-se para consultar ou
                registrar informações da operação.
            </p>
            <button id="retry" type="button">Tentar novamente</button>
            <small id="feedback" aria-live="polite"></small>
        </main>
        <script>
            const retryButton = document.querySelector('#retry');
            const feedback = document.querySelector('#feedback');

            function retry() {
                if (navigator.onLine) {
                    window.location.replace('/dashboard');
                    return;
                }

                feedback.textContent = 'A conexão ainda não voltou.';
            }

            retryButton.addEventListener('click', retry);
            window.addEventListener('online', retry);
        </script>
    </body>
</html>
